name: AutoArmory CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run test:conformance
      - run: node bin/autoarmory.js observe examples/incidents.jsonl --json
      - run: printf 'FAIL: runner failure\n' | node bin/autoarmory.js observe - --format log --json | grep test_failure
      - run: node bin/autoarmory.js learn examples/decisions.jsonl --json
      - run: node bin/autoarmory.js environment --write
      - name: Verify gate fails closed without SkillCanary
        run: |
          if node bin/autoarmory.js evolve examples/incidents.jsonl --state /tmp/autoarmory-state --skillcanary /nonexistent --json > /tmp/autoarmory-evolve.json; then
            echo "expected evolve to fail closed" >&2
            exit 1
          fi
          grep '"gated": 0' /tmp/autoarmory-evolve.json
