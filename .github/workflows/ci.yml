name: SelfForge CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: node bin/selfforge.js observe examples/incidents.jsonl --json
      - run: node bin/selfforge.js learn examples/decisions.jsonl --json
      - run: node bin/selfforge.js environment --write
      - name: Verify gate fails closed without SkillCanary
        run: |
          if node bin/selfforge.js evolve examples/incidents.jsonl --state /tmp/selfforge-state --skillcanary /nonexistent --json > /tmp/selfforge-evolve.json; then
            echo "expected evolve to fail closed" >&2
            exit 1
          fi
          grep '"gated": 0' /tmp/selfforge-evolve.json
