name: ci

on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: full suite
        run: npm test
      - name: conformance
        run: npm run test:conformance
      - name: self-eval
        run: npm run test:self-eval
      - name: portable profile (must show PASS and FAIL)
        run: node scripts/profile-run.js

  anchors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: re-fetch every anchor through its declared channel
        run: npm run check:anchors
