name: Feature request
description: Suggest a change.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What evidence would show it works?
      description: A failing case, a reproduction, or an expected state transition.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered