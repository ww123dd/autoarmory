name: Bug report
description: Something is broken.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the command and the smallest input that reproduces it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "skillcanary --version"